<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#151515" />
  
  <!-- 3 Vertical Chart Bars -->
  <!-- Bar 1 (Left) -->
  <rect x="14" y="53" width="20" height="40" rx="4" fill="#FFFFFF" />
  
  <!-- Bar 2 (Middle) -->
  <rect x="39" y="45" width="20" height="48" rx="4" fill="#FFFFFF" />
  
  <!-- Bar 3 (Right) -->
  <rect x="64" y="33" width="20" height="60" rx="4" fill="#FFFFFF" />
  
  <!-- Mask/Cutout border around the arrow to separate from bars -->
  <path
    d="M 9 56 L 39 34 L 56 46 L 82 20"
    fill="none"
    stroke="#151515"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <polygon
    points="97,7 75,13 83,21 91,29"
    fill="#151515"
    stroke="#151515"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Accent Arrow Shaft -->
  <path
    d="M 9 56 L 39 34 L 56 46 L 82 20"
    fill="none"
    stroke="#FFE13B"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  
  <!-- Accent Arrow Head with notched base -->
  <polygon
    points="97,7 76,14 82,20 90,26"
    fill="#FFE13B"
    stroke="#FFE13B"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
</svg>
